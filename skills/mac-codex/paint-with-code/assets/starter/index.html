<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint with Code</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #d8d9d6;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      #art {
        width: min(100vw, 1600px);
        line-height: 0;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <main id="art" aria-label="Code-painted artwork"></main>
    <script src="./vendor/brush.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
